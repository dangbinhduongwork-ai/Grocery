# Local development overrides (loaded automatically by `docker compose up`).
# In production, run with `docker compose -f docker-compose.yml up -d`.
services:
  sqlserver:
    environment:
      # Developer edition is licensed for non-production development/test only (DEC-010).
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      # Dev-only fallback placeholder; copy .env.example to .env to customize.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-GroceryHub_Dev_Sql_2026!}"
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - groceryhub_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
