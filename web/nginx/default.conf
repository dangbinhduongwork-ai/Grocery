# =============================================================================
# GroceryHub — Production Nginx Configuration (nginx-unprivileged)
# Listens on port 8080 (unprivileged user)
# Serves React 19 SPA + Reverse Proxies /api/ and /health/ to ASP.NET Core API
# =============================================================================

limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static text/JSON/CSS/JS assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Maximum client upload size (5 MB image uploads + overhead)
    client_max_body_size 10M;

    # Global baseline security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://qr.sepay.vn; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Hashed static assets — long-term immutable caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA index.html — never cache to ensure immediate release pickup
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://qr.sepay.vn; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    }

    # Hardened SePay Webhook Proxy
    # Limits body size to 64k, applies strict rate limiting, allows SePay dispatcher IPs
    location = /api/v1/payments/sepay/webhook {
        client_max_body_size 64k;
        limit_req zone=webhook_limit burst=5 nodelay;

        # SePay Official IP Allowlist (https://developer.sepay.vn/vi/dia-chi-ip)
        # Allow SePay official dispatcher IPs
        allow 172.236.138.20/32;
        allow 172.233.83.68/32;
        allow 171.244.35.2/32;
        allow 151.158.108.68/32;
        allow 151.158.109.79/32;
        allow 103.255.238.139/32;
        allow 45.57.137.67/32;
        allow 2400:8905::2000:8cff:fe98:45cd/128;
        allow 2600:3c15::2000:8aff:fedd:874b/128;
        # Allow loopback, internal Docker bridge, and private networks (for dev simulation & testing)
        allow 127.0.0.1/32;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1/128;
        deny all;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads fallback proxy -> rewrites /uploads/{file} to /api/v1/catalog/images/{file}
    location /uploads/ {
        rewrite ^/uploads/(.*)$ /api/v1/catalog/images/$1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API reverse proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check proxy
    location /health/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # SPA routing fallback: serve index.html for any unhandled client route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
