# GroceryHub - Nginx Reverse Proxy Configuration for SePay Webhook
# docs/spec/11-SEPAY-INTEGRATION.md §9, §11 (T-PAY-23), TM-PAY-01

# Rate limiting zone for SePay Webhooks (e.g., 30 requests per minute per IP)
limit_req_zone $binary_remote_addr zone=sepay_webhook_limit:10m rate=30r/m;

location /api/v1/payments/sepay-webhook {
    # 1. Enforce Max Body Size (64 KB) to mitigate DoS / resource exhaustion attacks
    client_max_body_size 64k;

    # 2. Rate Limiting: burst=10, no delay on small bursts
    limit_req zone=sepay_webhook_limit burst=10 nodelay;

    # 3. IP Allowlist (Official SePay Webhook Egress IPs per developer.sepay.vn/vi/dia-chi-ip)
    # Note: Enable 'deny all;' in production once reverse-proxy network topology is configured.
    allow 172.236.138.20;
    allow 172.233.83.68;
    allow 171.244.35.2;
    allow 151.158.108.68;
    allow 151.158.109.79;
    allow 103.255.238.139;
    allow 45.57.137.67;
    allow 2400:8905::2000:8cff:fe98:45cd;
    allow 2600:3c15::2000:8aff:fedd:874b;
    # allow 127.0.0.1; # For local docker bridge / health checks if needed
    # deny all;

    # 4. Proxy Configuration
    proxy_pass http://api:8080/api/v1/payments/sepay-webhook;
    proxy_http_version 1.1;

    # Preserve essential headers for HMAC signature and timestamp verification
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SePay-Signature $http_x_sepay_signature;
    proxy_set_header X-SePay-Timestamp $http_x_sepay_timestamp;
    proxy_set_header Authorization $http_authorization;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}
