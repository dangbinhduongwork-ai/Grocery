name: CI

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Security & Reality Verification
  # ===========================================================================
  secret-and-reality-scan:
    name: Secret & Reality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ripgrep for reality scan
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run verify-reality scan
        run: bash scripts/verify-reality.sh

  # ===========================================================================
  # 2. Backend Build & Test (.NET 10 LTS)
  # ===========================================================================
  backend-build-and-test:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore GroceryHub.sln

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build solution (-warnaserror)
        run: dotnet build GroceryHub.sln --no-restore -warnaserror

      - name: Check for vulnerable NuGet packages
        run: |
          output=$(dotnet list package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "Vulnerable NuGet packages detected!"
            exit 1
          fi

      - name: Pre-pull SQL Server testcontainer image
        run: docker pull mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04

      - name: Run unit, architecture, and integration tests
        run: dotnet test GroceryHub.sln --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx"

      - name: Report Test Results Summary
        if: always()
        run: |
          python3 -c "
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('**/TestResults/*.trx', recursive=True)
          print(f'Found {len(files)} TRX files.')
          failed = 0
          for trx in files:
              tree = ET.parse(trx)
              root = tree.getroot()
              ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              for r in root.findall('.//t:UnitTestResult', ns):
                  if r.attrib.get('outcome') == 'Failed':
                      failed += 1
                      test_name = r.attrib.get('testName')
                      err = r.find('.//t:Output/t:ErrorInfo/t:Message', ns)
                      trace = r.find('.//t:Output/t:ErrorInfo/t:StackTrace', ns)
                      msg = err.text if err is not None else 'No message'
                      st = trace.text if trace is not None else ''
                      print('='*70)
                      print(f'FAILED TEST: {test_name}')
                      print(f'MESSAGE:\n{msg}')
                      print(f'STACK:\n{st[:400]}')
          print(f'TOTAL FAILED TESTS: {failed}')
          "

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  # ===========================================================================
  # 3. Frontend Build & Test (React 19 + TypeScript + Vite)
  # ===========================================================================
  frontend-build-and-test:
    name: Frontend Build & Test (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Vitest unit tests
        run: npm test -- --run

      - name: Build production SPA (tsc + vite)
        run: npm run build

      - name: Audit npm production dependencies
        run: npm audit --omit=dev

  # ===========================================================================
  # 4. Container Image Build Verification
  # ===========================================================================
  docker-build-verification:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend API & Migrator Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          target: runtime
          push: false
          tags: groceryhub-api:test

      - name: Build Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runtime
          push: false
          tags: groceryhub-web:test
